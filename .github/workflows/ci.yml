name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: typecheck + build + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:ci --workspace @nanobpm/bojtos-kit
