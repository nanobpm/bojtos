name: release

# Runs on every push to `main` and lets semantic-release decide, from the
# conventional-commit history, whether a release is due and what the next
# version is. When one is, it:
#
#   1. bumps both package manifests + the internal cross-dep pin, in lockstep
#      (scripts/set-version.mjs), then
#   2. publishes the two Bojtos packages in dependency order
#      (scripts/release.mjs — idempotent, so a re-run is safe):
#
#        @nanobpm/bojtos-kit  ->  @nanobpm/bojtos-react
#
#      and finally
#   3. cuts the git tag `v<version>` + a GitHub Release with the notes.
#
# (@nanobpm/engine-wasm is published separately from the nano-bpm repo and is
# consumed here as an ordinary npm dependency.)
#
# Authentication for the npm publish is OIDC trusted publishing - NO NPM_TOKEN.
# Each package must have a Trusted Publisher configured on npmjs.com pointing at
# this repo + this workflow file (see docs/releasing.md). Because this repository
# is public, npm provenance is enabled (NPM_CONFIG_PROVENANCE=true). The tag and
# GitHub Release are created by semantic-release via the default GITHUB_TOKEN; we
# deliberately do NOT commit the version bump back to `main` (no
# @semantic-release/git), so there is no protected-branch friction and no release
# commit loop.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Avoid two overlapping releases racing to publish/tag the same version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Bojtos packages
    runs-on: ubuntu-24.04
    permissions:
      # id-token: write lets npm exchange the GitHub OIDC token for a
      # short-lived publish token (trusted publishing); it also signs provenance.
      id-token: write
      # contents: write lets semantic-release push the `v<version>` tag and
      # create the GitHub Release.
      contents: write
      # issues/pull-requests: write lets @semantic-release/github comment the
      # released version back on the PRs/issues it shipped.
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          # semantic-release needs the full history + tags to determine the last
          # release and compute the next version.
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm OIDC trusted publishing needs npm CLI >= 11.5.1; pin a known-good
      # version for reproducible release builds.
      - name: Upgrade npm (OIDC-capable)
        run: npm install -g npm@11.5.1

      - name: Install
        run: npm ci

      - name: Build & test
        run: |
          npm run build
          npm run test:ci --workspace @nanobpm/bojtos-kit
          npm run test:ci --workspace @nanobpm/bojtos-react

      - name: Release (semantic-release -> set-version + publish + tag)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        # Invoke the semantic-release binary DIRECTLY, not via `npx`. `npx`
        # (= `npm exec`) exports the resolved npm config into the child
        # environment as `npm_config_*` vars — including an *empty*
        # `npm_config_//registry.npmjs.org/:_authToken` derived from the
        # setup-node .npmrc placeholder. That empty auth env leaks down into the
        # nested `npm publish` (scripts/release.mjs), where npm treats "auth is
        # configured (but empty)" as a reason to SKIP OIDC trusted publishing and
        # publish anonymously — which the registry rejects as a masked 404.
        # Running the bin directly keeps the release env clean so the nested
        # `npm publish` engages OIDC. (Provenance is auth-independent, which is
        # why it signed successfully even while the publish 404'd.)
        run: ./node_modules/.bin/semantic-release
